name: Tests

# The tests import the published addon-test harness from a SIBLING checkout
# of the host repo (../ttrpg-codex), so CI checks out both.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: dnd-character-sheets

      - uses: actions/checkout@v5
        with:
          repository: pjunak/ttrpg-codex
          path: ttrpg-codex

      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - run: node --test tests/smoke.mjs tests/rules.mjs tests/ui-state.mjs tests/equipment-model.mjs tests/sheet-transfer.mjs tests/provider-state.mjs
        working-directory: dnd-character-sheets
