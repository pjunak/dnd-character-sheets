name: Tests

# The tests import the published addon-test harness from a SIBLING checkout
# of the host repo (../ttrpg-codex), so CI checks out both.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: dnd-character-sheets

      - uses: actions/checkout@v7
        with:
          repository: pjunak/ttrpg-codex
          path: ttrpg-codex

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: node --test tests/*.mjs
        working-directory: dnd-character-sheets
