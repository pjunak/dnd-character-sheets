name: Tests

# Tests import the published host harness and exercise the extracted engine
# through sibling checkouts, matching the local suite layout.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: dnd-character-sheets

      - uses: actions/checkout@v7
        with:
          repository: pjunak/ttrpg-codex
          path: ttrpg-codex

      - uses: actions/checkout@v7
        with:
          repository: pjunak/addon-dnd-engine
          path: addon-dnd-engine

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: node --test tests/*.mjs
        working-directory: dnd-character-sheets
